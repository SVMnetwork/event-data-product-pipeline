stages: [validate, test, build, deploy]

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
  cache:
    paths: [.cache/pip]

lint-format:
  stage: validate
  script:
    - ruff format --check src tests
    - ruff check src tests

data-contract:
  stage: validate
  script:
    - python -m src.main --input data/input/events.json --output data/output
    - python -c "import json; s=json.load(open('data/output/run_summary.json')); assert s['curated_records'] > 0"
  artifacts:
    when: always
    paths: [data/output/]

unit-tests:
  stage: test
  script: ["python -m pytest"]

package:
  stage: build
  script: ["python -m compileall -q src"]
  artifacts:
    paths: [src/, orchestration/, pyproject.toml]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-dev:
  stage: deploy
  environment: dev
  script: ["echo 'Promote immutable package and environment config to dev (conceptual)'"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-test:
  stage: deploy
  environment: test
  needs: [deploy-dev]
  script: ["echo 'Promote the same immutable package and reviewed GCP config to test (conceptual)'"]
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-production:
  stage: deploy
  environment: production
  needs: [deploy-test]
  script: ["echo 'Promote the tested immutable artifact to GCP production (conceptual)'"]
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
