[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'event-data-product-pipeline'
version = '0.1.0'
description = 'Event data curation pipeline'
readme = 'README.md'
requires-python = '>=3.10'

[tool.setuptools]
packages = ['src']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
